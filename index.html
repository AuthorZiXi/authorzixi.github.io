<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>AuthorZiXi</title>
    <meta name="description" content="AuthorZiXi 的个人站点，收录自用的小工具与 PWA。">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230969da'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3EZ%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f6f7f9;
            --card: #ffffff;
            --fg: #1f2328;
            --muted: #656d76;
            --border: #d0d7de;
            --accent: #0969da;
            --accent-hover: #0860ca;
            --accent-fg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --card: #151b23;
                --fg: #e6edf3;
                --muted: #9198a1;
                --border: #3d444d;
                --accent: #1f6feb;
                --accent-hover: #388bfd;
                --accent-fg: #ffffff;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 28px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            letter-spacing: -0.01em;
            word-break: break-all;
        }

        .sub {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--accent);
            color: var(--accent-fg);
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .15s ease, transform .15s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .hint {
            margin: 24px 0 0;
            color: var(--muted);
            font-size: 0.8rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>authorzixi.github.io</h1>
        <p class="sub">个人站点，放一些自用的小工具和 PWA。</p>

        <a class="btn" href="https://github.com/AuthorZiXi/authorzixi.github.io" target="_blank"
            rel="noopener noreferrer">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
            </svg>
            在 GitHub 上查看
        </a>

        <p class="hint">项目介绍、源码和更新记录都在仓库的 README 里。</p>
    </main>
</body>

</html>
