<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0e17">


    <link rel="icon" type="image/png" sizes="192x192" href="icons/192.png">
    <!-- iOS -->
    <link rel="apple-touch-icon" href="icons/192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="数桥">

    <title>数桥 · Hashiwokakero</title>
    <style>
        /* ===== 样式 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0e17;
            --surface: rgba(20, 28, 48, 0.75);
            --surface-border: rgba(64, 164, 223, 0.20);
            --text: #eef5ff;
            --text-dim: #7a8aa8;
            --accent: #40a4df;
            --accent-glow: rgba(64, 164, 223, 0.35);
            --accent-green: #4cd9a0;
            --accent-amber: #f5c542;
            --danger: #f05a6a;
            --radius: 16px;
            --shadow: 0 12px 48px rgba(0, 0, 0, 0.60);
            --font: 'Inter', system-ui, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            padding: 8px;
            margin: 0;
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            padding: 10px 12px 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 18px;
            user-select: none;
            cursor: default;
        }

        .logo span {
            background: var(--accent);
            color: #0b0e17;
            padding: 1px 10px 1px 8px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 8px;
            padding: 3px 0;
        }

        .controls .group {
            display: flex;
            align-items: center;
            gap: 4px 6px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 8px 2px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .controls label {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .controls input[type="number"],
        .controls input[type="text"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 2px 10px;
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: border 0.2s;
            text-align: center;
            min-width: 50px;
            flex: 1;
        }

        .controls input[type="text"] {
            min-width: 80px;
            text-align: left;
        }

        .controls input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.20s;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent);
            color: #0b0e17;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #5bb4f0;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-green {
            background: var(--accent-green);
            color: #0b0e17;
            font-weight: 600;
        }

        .btn-green:hover {
            background: #60e6b0;
            box-shadow: 0 0 20px rgba(76, 217, 160, 0.35);
        }

        .btn-outline {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn-outline:hover {
            border-color: var(--accent);
        }

        .btn-sm {
            padding: 2px 8px;
            font-size: 12px;
        }

        .btn-knife {
            background: rgba(245, 197, 66, 0.15);
            border-color: var(--accent-amber);
            color: var(--accent-amber);
        }

        .btn-knife.active {
            background: var(--accent-amber);
            color: #0b0e17;
            box-shadow: 0 0 20px rgba(245, 197, 66, 0.30);
        }

        .btn-aux {
            background: rgba(76, 217, 160, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .btn-aux.active {
            background: var(--accent-green);
            color: #0b0e17;
            box-shadow: 0 0 20px rgba(76, 217, 160, 0.30);
        }

        .preset-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .preset-btn {
            font-size: 12px;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.10);
            color: var(--text);
        }

        .canvas-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: auto;
            touch-action: none;
        }

        .canvas-wrap canvas {
            display: block;
            touch-action: none;
        }

        .canvas-wrap.knife canvas {
            cursor: crosshair;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 10px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: var(--text-dim);
        }

        .footer .progress-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 80px;
        }

        .footer .bar-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            min-width: 40px;
        }

        .footer .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent));
            border-radius: 10px;
            transition: width 0.30s ease;
        }

        .footer .status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-dot 1.6s infinite;
        }

        .status .dot.green {
            background: var(--accent-green);
        }

        .status .dot.amber {
            background: var(--accent-amber);
        }

        .status .dot.danger {
            background: var(--danger);
            animation: none;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .footer .seed-hash {
            font-family: monospace;
            font-size: 11px;
            opacity: 0.5;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .footer .credit {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .footer .credit a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: 0.2s;
        }

        .footer .credit a:hover {
            color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(12, 18, 30, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 13px;
            color: var(--text);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.50);
            transition: all 0.40s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            text-align: center;
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0px);
        }

        .toast.error {
            border-color: var(--danger);
            color: #ffb0b0;
        }

        .toast.success {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* ===== 调试面板 ===== */
        .debug-panel {
            display: none;
            position: fixed;
            bottom: 70px;
            right: 16px;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            gap: 8px;
            flex-direction: column;
            font-size: 12px;
            z-index: 100;
            min-width: 200px;
            max-height: 70vh;
            overflow-y: auto;
            color: var(--text);
        }

        .debug-panel.show {
            display: flex;
        }

        .debug-panel .debug-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .debug-panel .debug-section:first-child {
            border-top: none;
        }

        .debug-panel .debug-label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
            margin-right: 6px;
        }

        .debug-panel .debug-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .debug-panel .debug-row input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 4px;
        }

        .debug-panel .debug-row input[type="number"] {
            width: 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 1px 6px;
            color: var(--text);
            font-size: 12px;
            text-align: center;
            font-family: var(--font);
            outline: none;
        }

        .debug-panel .debug-row input[type="number"]:focus {
            border-color: var(--accent);
        }

        .debug-panel .debug-btn-sm {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 20px;
            padding: 2px 10px;
            color: var(--text);
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }

        .debug-panel .debug-btn-sm:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .debug-panel .debug-info {
            font-size: 11px;
            color: var(--text-dim);
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .debug-panel .debug-info .highlight {
            color: var(--accent-green);
        }

        @media (max-width: 700px) {
            .app {
                padding: 6px 8px;
                gap: 6px;
            }

            .logo {
                font-size: 16px;
            }

            .logo span {
                font-size: 12px;
            }

            .controls .group {
                padding: 2px 6px;
            }

            .controls input[type="number"] {
                min-width: 40px;
                font-size: 13px;
                padding: 1px 6px;
            }

            .controls input[type="text"] {
                min-width: 60px;
                font-size: 13px;
            }

            .btn {
                font-size: 12px;
                padding: 3px 8px;
            }

            .preset-btn {
                font-size: 11px;
                padding: 2px 6px;
            }

            .footer {
                font-size: 11px;
            }

            .footer .seed-hash {
                max-width: 60px;
            }

            .footer .credit {
                font-size: 10px;
                flex-wrap: wrap;
            }

            .toast {
                font-size: 12px;
                padding: 6px 16px;
                bottom: 14px;
            }

            .debug-panel {
                right: 8px;
                bottom: 60px;
                min-width: 160px;
                padding: 10px 12px;
            }
        }

        @media (max-width: 480px) {
            .controls .group {
                padding: 1px 4px;
                gap: 3px;
            }

            .controls label {
                font-size: 11px;
            }

            .controls input[type="number"] {
                min-width: 32px;
                font-size: 12px;
            }

            .controls input[type="text"] {
                min-width: 50px;
                font-size: 12px;
            }

            .btn {
                font-size: 11px;
                padding: 2px 6px;
            }

            .preset-btn {
                font-size: 10px;
                padding: 1px 5px;
            }

            .debug-panel {
                min-width: 140px;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
    </style>
</head>

            <button class="debug-btn-sm" id="dbgForceConnect">🔗 强制连通</button>
