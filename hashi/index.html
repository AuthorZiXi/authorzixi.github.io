<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0e17">

    <link rel="icon" type="image/png" sizes="192x192" href="icons/192.png">
    <link rel="apple-touch-icon" href="icons/192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="数桥">

    <title>数桥 · Hashiwokakero</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app" id="app">

        <!-- 全屏画布（主体） -->
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- 顶部悬浮：logo + 菜单按钮 -->
        <div class="topbar">
            <div class="logo" id="logo">
                <img src="icons/192.png" alt="" class="logo-icon" />
                <span class="logo-text">数桥 <em>Hashi</em></span>
            </div>
            <button class="icon-btn" id="btnMenu" title="菜单" aria-label="菜单">☰</button>
        </div>

        <!-- 菜单面板 -->
        <div class="menu-panel" id="menuPanel">
            <div class="menu-label">生成</div>
            <div class="menu-row">
                <input type="text" id="seedInput" placeholder="种子" value="20260905" />
                <button class="btn btn-sm btn-outline" id="btnRandomSeed">🎲</button>
            </div>
            <div class="menu-row">
                <input type="number" id="widthInput" value="7" min="4" max="256" />
                <span class="sep">×</span>
                <input type="number" id="heightInput" value="7" min="4" max="256" />
                <button class="btn btn-sm btn-primary" id="btnGenerate">✦ 生成</button>
            </div>

            <div class="menu-label">预设</div>
            <div class="preset-group">
                <button class="preset-btn" data-w="7" data-h="7">7×7</button>
                <button class="preset-btn" data-w="18" data-h="18">18×18</button>
                <button class="preset-btn" data-w="50" data-h="50">50×50</button>
                <button class="preset-btn" data-w="128" data-h="128">128×128</button>
                <button class="preset-btn" data-w="256" data-h="256">256×256</button>
            </div>

            <div class="menu-label">操作</div>
            <div class="menu-grid">
                <button class="btn btn-sm btn-green" id="btnSolve">🧩 求解</button>
                <button class="btn btn-sm btn-outline" id="btnCheck">✓ 检查</button>
                <button class="btn btn-sm btn-knife" id="btnKnife">🔪 美工刀</button>
                <button class="btn btn-sm btn-aux" id="btnAux">💡 辅助</button>
                <button class="btn btn-sm btn-outline" id="btnResetBridges">🧹 清桥</button>
                <button class="btn btn-sm btn-outline" id="btnImport">📂 导入</button>
                <button class="btn btn-sm btn-outline" id="btnExport">📥 CSV</button>
                <button class="btn btn-sm btn-outline" id="btnExportImage">🖼️ 图片</button>
            </div>
        </div>

        <!-- 左下角：进度胶囊 -->
        <div class="progress-pill">
            <span id="progressText">0 / 0</span>
            <div class="bar-track">
                <div class="bar-fill" id="progressFill"></div>
            </div>
            <span class="dot" id="statusDot"></span>
        </div>

        <!-- 右下角：信息按钮 + 信息卡片 -->
        <button class="icon-btn info-btn" id="btnInfo" title="信息" aria-label="信息">ⓘ</button>
        <div class="info-card" id="infoCard">
            <div class="info-title">数桥 · Hashiwokakero</div>
            <div class="info-row">
                <span>状态</span>
                <strong id="statusText">就绪</strong>
            </div>
            <div class="info-row">
                <span>种子</span>
                <strong id="seedHash">—</strong>
            </div>
            <div class="info-row">
                <span>版本</span>
                <strong id="versionText">v—</strong>
            </div>
            <div class="info-divider"></div>
            <div class="credit">
                <span>制作: <a href="https://www.deepseek.com/" target="_blank">DeepSeek</a></span>
                <span>设计: <a href="https://github.com/AuthorZiXi" target="_blank">AuthorZiXi</a></span>
                <span>源码: <a href="https://github.com/AuthorZiXi/authorzixi.github.io/" target="_blank">GitHub ·
                        hashi/</a></span>
                <span><a href="privacy.html">隐私政策</a></span>
                <span>2026/10/2</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ===== 调试面板 ===== -->
    <div class="debug-panel" id="debugPanel">
        <div class="debug-section">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:600;font-size:13px;">🎛️ 视觉配置</span>
                <button class="debug-btn-sm" id="debugResetDefaults">重置默认</button>
            </div>
            <div class="debug-row">
                <span class="debug-label">格子大小(px)</span>
                <input type="range" id="cfgCellSize" min="10" max="80" step="1" value="40" />
                <input type="number" id="cfgCellSizeNum" min="10" max="80" step="1" value="40" />
            </div>
            <div class="debug-row">
                <span class="debug-label">桥宽(px)</span>
                <input type="range" id="cfgBridgeWidth" min="1" max="8" step="0.5" value="4" />
                <input type="number" id="cfgBridgeWidthNum" min="1" max="8" step="0.5" value="4" />
            </div>
            <div class="debug-row">
                <span class="debug-label">坐标大小(px)</span>
                <input type="range" id="cfgCoordSize" min="8" max="28" step="1" value="16" />
                <input type="number" id="cfgCoordSizeNum" min="8" max="28" step="1" value="16" />
            </div>
            <div class="debug-row">
                <span class="debug-label">岛屿大小(比例)</span>
                <input type="range" id="cfgIslandSize" min="0.10" max="0.50" step="0.01" value="0.20" />
                <input type="number" id="cfgIslandSizeNum" min="0.10" max="0.50" step="0.01" value="0.20" />
            </div>
            <div class="debug-row">
                <span class="debug-label">画布边距(px)</span>
                <input type="range" id="cfgPadding" min="20" max="80" step="1" value="45" />
                <input type="number" id="cfgPaddingNum" min="20" max="80" step="1" value="45" />
            </div>
        </div>
        <div class="debug-section">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:600;font-size:13px;">📊 游戏状态</span>
                <button class="debug-btn-sm" id="debugRefreshState">刷新</button>
            </div>
            <div class="debug-info" id="debugStateInfo">就绪</div>
        </div>
        <div class="debug-section">
            <button class="debug-btn-sm" id="dbgShowIsolated">📍 显示孤立岛</button>
            <button class="debug-btn-sm" id="dbgForceConnect">🔗 强制连通</button>
            <button class="debug-btn-sm" id="dbgLogState">📋 输出状态到控制台</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
